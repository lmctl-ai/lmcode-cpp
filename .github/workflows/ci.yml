name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compiler_version:
        description: "Published @lmctl-ai/lmctl version"
        required: false
        default: "0.2.444"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
          - { os: windows-2022,     name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: toolchain (windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v g++ >/dev/null 2>&1 || ! command -v make >/dev/null 2>&1; then
            for i in 1 2 3; do
              choco install -y mingw make && break
              echo "choco attempt $i failed; retrying"; sleep 20
            done
          fi
          g++ --version | head -1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: lmscript compiler (npm @lmctl-ai/lmctl)
        run: |
          compiler_version="${{ inputs.compiler_version || vars.LMCODE_COMPILER_VERSION || '0.2.444' }}"
          npm install --prefix "$RUNNER_TEMP/lmcode-lmctl" "@lmctl-ai/lmctl@$compiler_version"
          echo "$RUNNER_TEMP/lmcode-lmctl/node_modules/.bin" >> "$GITHUB_PATH"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export LMSCRIPT_BIN="$RUNNER_TEMP/lmcode-lmctl/node_modules/.bin/lmscript.cmd"
            echo "LMSCRIPT_BIN=$LMSCRIPT_BIN" >> "$GITHUB_ENV"
            "$LMSCRIPT_BIN" --version
          else
            export PATH="$RUNNER_TEMP/lmcode-lmctl/node_modules/.bin:$PATH"
            echo "LMSCRIPT_BIN=lmscript" >> "$GITHUB_ENV"
            lmscript --version
          fi

      - name: python3 shim (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
          chmod +x .ci-bin/python3
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: matrix orchestration tests
        if: runner.os == 'Linux'
        run: bash scripts/test-matrix.sh

      - name: canonical std schema and merge helper
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-merge-std.py

      - name: generated std documentation
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/test_std_docs.py

      - name: benchmark workload expectations
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/test_bench_stdlib.py

      - name: unit tests and string stdlib
        run: make test

      - name: conformance vectors
        run: make conformance
