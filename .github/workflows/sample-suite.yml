name: Shared sample corpus
on:
  workflow_dispatch:
    inputs:
      compiler:
        description: Published compiler version or latest
        default: 'latest'
        type: string
  repository_dispatch:
    types: [lmcode-language-changed]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    env:
      LMSCRIPT_VERSION: ${{ inputs.compiler || github.event.client_payload.compiler || 'latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: lmcode-cpp
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lmctl-ai/lmcode-cpp-sample
          ref: 7ff3ed0b6f927522676840b3f3c5adc9e1272579
          path: lmcode-cpp-sample
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global "@lmctl-ai/lmctl@$LMSCRIPT_VERSION"
      - name: Run current SDK and canonical corpus against the pinned reference host
        run: make -C lmcode-cpp sample-suite
      - name: Recompile supported source wrappers and report compiler feature gaps
        run: cd lmcode-cpp && lmscript --no-preflight sample-suite/check-recompile.lms
