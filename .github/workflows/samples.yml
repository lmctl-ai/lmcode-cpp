name: Cross-port sample corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-24.04
    env:
      SAMPLE_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: lmcode-cpp
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-c-sample, path: lmcode-c-sample, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-cpp-sample, path: lmcode-cpp-sample, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-rust-sample, path: lmcode-rust-sample, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-go-sample, path: lmcode-go-sample, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-csharp-sample, path: lmcode-csharp-sample, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-java-sample, path: lmcode-java-sample, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-kotlin-sample, path: lmcode-kotlin-sample, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: lmctl-ai/lmcode-scala-sample, path: lmcode-scala-sample, persist-credentials: false }
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version: 'stable' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24' }
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1
      - name: Install required cross-port toolchains and pinned compiler
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update
          sudo apt-get install -y dotnet-sdk-8.0 maven
          npm install --global @lmctl-ai/lmctl@0.2.426
          lmscript --version
      - name: Matrix orchestration regression tests
        working-directory: lmcode-cpp
        run: python3 -B tests/test_run_all_samples.py
      - name: Verify caught-up ports against the complete corpus
        working-directory: lmcode-cpp
        run: ./sample-suite/run-all-samples.sh --ports c,cpp,rust,go,csharp,java
      - name: Report every sample port and compare actual output bytes
        if: always()
        working-directory: lmcode-cpp
        run: ./sample-suite/run-all-samples.sh --all
